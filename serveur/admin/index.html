<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NATX ROYALE — Administration</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="admin.css?v=11">
</head>
<body>
<!-- Connexion -->
<main id="ecranConnexion" class="connexion cache">
  <form id="formConnexion" class="carte-connexion" autocomplete="on">
    <div class="logo">NATX<span>ROYALE</span></div>
    <p class="sous">Espace administrateur</p>
    <label>Identifiant<input id="identifiant" name="username" autocomplete="username" required maxlength="60"></label>
    <label>Mot de passe<input id="motDePasse" name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
    <button class="bouton principal" type="submit">Se connecter</button>
    <p id="erreurConnexion" class="erreur" role="alert"></p>
  </form>
</main>

<!-- Espace admin : le menu et les pages sont fabriqués selon les permissions du rôle (vérifiées aussi par le serveur) -->
<div id="ecranAdmin" class="admin cache">
  <header class="barre-mobile">
    <button id="btnMenu" class="bouton discret" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    <div class="logo petit">NATX<span>ROYALE</span></div>
    <span id="titreMobile" class="titre-mobile"></span>
  </header>
  <aside class="menu" id="menuLateral">
    <div class="logo petit">NATX<span>ROYALE</span></div>
    <nav id="navigation" aria-label="Pages de l'administration"></nav>
    <div class="moi">
      <span id="nomAdmin"></span>
      <span id="roleAdmin" class="role-admin"></span>
      <button id="btnDeconnexion" class="bouton discret">Se déconnecter</button>
    </div>
  </aside>
  <div class="voile-menu" id="voileMenu"></div>
  <main class="contenu" id="contenu" tabindex="-1"></main>
  <aside id="tiroir" class="tiroir cache" aria-label="Détail">
    <header><h2 id="tiroirTitre"></h2><button id="fermerTiroir" class="bouton discret" aria-label="Fermer">✕</button></header>
    <div id="tiroirCorps" class="tiroir-corps"></div>
  </aside>
</div>

<!-- Confirmation des actions sensibles -->
<div id="modale" class="modale cache" role="dialog" aria-modal="true" aria-labelledby="modaleTitre">
  <form id="modaleForm" class="carte-modale">
    <h2 id="modaleTitre"></h2>
    <p id="modaleTexte"></p>
    <label id="modaleBlocMot" class="cache"><span id="modaleConsigne"></span><input id="modaleMot" autocomplete="off"></label>
    <label id="modaleBlocMdp" class="cache">Ton mot de passe (pour confirmer que c'est bien toi)<input id="modaleMdp" type="password" autocomplete="current-password"></label>
    <div class="actions"><button type="submit" id="modaleOk" class="bouton danger">Confirmer</button><button type="button" id="modaleAnnuler" class="bouton discret">Annuler</button></div>
  </form>
</div>
<div id="toast" class="toast cache" role="status"></div>
<script type="module" src="admin.js?v=11"></script>
</body>
</html>
